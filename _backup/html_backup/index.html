<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account Practice OS – Operations Platform Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root{--bg:#f3f5f9;--sf:#fff;--s2:#f8fafc;--tx:#0e1530;--mu:#64708a;--bd:#e3e8f0;--ac:#3a4bdc;--ac2:#0fb5a6;--ok:#12a36b;--wn:#d98a0b;--er:#dc3d4a;--sb:#0a1030;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--f:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--d:'Fraunces',Georgia,serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#070b1a;--sf:#101731;--s2:#0c1229;--tx:#e9edf8;--mu:#8e9ab8;--bd:#1f2a4a;--ac:#7c8bff;--ok:#2fd196;--wn:#f2b14a;--er:#ff6b77}}
:root[data-theme=dark]{--bg:#070b1a;--sf:#101731;--s2:#0c1229;--tx:#e9edf8;--mu:#8e9ab8;--bd:#1f2a4a;--ac:#7c8bff;--ok:#2fd196;--wn:#f2b14a;--er:#ff6b77}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--f)}
button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--sb);color:#c7d0ee;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;padding:4px 10px 22px;color:#fff}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5b6bff,#0fb5a6);display:grid;place-items:center;font-style:normal;font-weight:700}
.logo b{font-family:var(--d);font-size:17px;line-height:1.1}.logo small{display:block;font:400 11px var(--f);color:#8d99c4}
aside nav button{display:flex;gap:10px;width:100%;align-items:center;background:none;border:0;color:inherit;padding:9px 12px;border-radius:9px;text-align:left}
aside nav button:hover{background:#ffffff12}aside nav button.on{background:linear-gradient(90deg,#3a4bdc,#3a4bdc99);color:#fff}
aside nav span{width:20px;text-align:center}aside .br{margin:18px 10px 0;padding:12px;border:1px solid #ffffff1c;border-radius:12px;font-size:12px;color:#9aa6cf}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top h1{font:600 26px var(--d);margin:0;flex:1}.top h1 small{display:block;font:400 13px var(--f);color:var(--mu);margin-top:2px}
.pill{background:var(--sf);border:1px solid var(--bd);padding:7px 12px;border-radius:99px;font-size:13px;color:var(--mu)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;display:grid;place-items:center;font-weight:700}
.g{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 1px 2px #0b12301a,0 8px 24px -14px #0b123040}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}.card h3 em{font-style:normal;margin-left:auto;font-weight:400;color:var(--mu);font-size:12px}
.kpi b{display:block;font:600 32px var(--d);letter-spacing:-.5px}.kpi span{color:var(--mu);font-size:13px}.kpi i{font-style:normal;color:var(--ok);font-size:12px;font-weight:600}
.hero{background:linear-gradient(120deg,#0a1030,#27358f 60%,#0b8f86);color:#fff;border:0;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero h2{font:600 24px/1.2 var(--d);margin:0 0 6px}.hero p{margin:0;color:#c9d3ff;max-width:560px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-weight:600}.btn.s{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}.btn.w{background:#fff;color:#1b2570}.btn.sm{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:600;color:var(--mu);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--bd)}td{padding:11px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--s2)}
.tb{overflow-x:auto}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#3a4bdc1a;color:var(--ac);white-space:nowrap}
.tag.ok{background:#12a36b1f;color:var(--ok)}.tag.wn{background:#d98a0b24;color:var(--wn)}.tag.er{background:#dc3d4a1f;color:var(--er)}.tag.mu{background:var(--s2);color:var(--mu);border:1px solid var(--bd)}
.bar{height:8px;background:var(--s2);border:1px solid var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .5s}
.feed{max-height:420px;overflow:auto}.feed div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px}.feed div:first-child{animation:fl .6s}.feed time{color:var(--mu);font-size:11px;white-space:nowrap;margin-left:auto}
@keyframes fl{from{background:#3a4bdc26}to{background:none}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac2);margin-top:6px;flex:none}.dot.h{background:var(--wn)}
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.steps button{flex:1;min-width:84px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px 6px;color:var(--mu);font-size:11px;text-align:center}
.steps b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;margin:0 auto 4px;background:var(--bd);color:var(--tx);font-size:12px}
.steps .dn{color:var(--ok)}.steps .dn b{background:var(--ok);color:#fff}.steps .cu{border-color:var(--ac);color:var(--tx);box-shadow:0 0 0 3px #3a4bdc26}.steps .cu b{background:var(--ac);color:#fff}
.cond{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.note{background:#d98a0b1c;border:1px solid #d98a0b55;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.note.ok{background:#12a36b18;border-color:#12a36b50}
.col{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px;min-height:200px}.col h4{margin:2px 4px 10px;font-size:12px;color:var(--mu)}
.kc{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px;cursor:pointer}.kc:hover{border-color:var(--ac)}.kc small{color:var(--mu);display:block}
.tl{position:relative;padding-left:22px}.tl div{position:relative;padding:0 0 16px;color:var(--mu)}.tl div:before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--bd);border:2px solid var(--sf);box-shadow:0 0 0 1px var(--bd)}.tl div:after{content:"";position:absolute;left:-17px;top:17px;bottom:-3px;width:2px;background:var(--bd)}.tl div:last-child:after{display:none}
.tl .a{color:var(--tx);font-weight:600}.tl .a:before{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.ov{position:fixed;inset:0;background:#050a1ccc;display:none;place-items:center;z-index:50;padding:16px}.ov.on{display:grid}
.ph{width:min(380px,100%);background:linear-gradient(170deg,#141c46,#0a1030);color:#fff;border-radius:28px;padding:22px;border:1px solid #ffffff22}
.ph .ln{background:#ffffff14;border-radius:14px;padding:9px 12px;margin:8px 0;font-size:13px;animation:fl .5s}.ph .ln.u{background:#0fb5a633;margin-left:30px}
.wave{display:flex;gap:3px;align-items:center;height:28px;justify-content:center}.wave i{width:4px;background:#0fb5a6;border-radius:4px;animation:wv 1s infinite ease-in-out}.wave i:nth-child(2n){animation-delay:.2s}.wave i:nth-child(3n){animation-delay:.4s}
@keyframes wv{0%,100%{height:6px}50%{height:26px}}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#0a1030;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 12px 30px #0006;z-index:60;transform:translateY(120px);transition:transform .3s;max-width:340px}.toast.on{transform:none}
input[type=range]{width:100%;accent-color:var(--ac)}
.mail{background:var(--s2);border:1px dashed var(--bd);border-radius:10px;padding:12px;font-size:13px;margin-top:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:10px}aside nav{display:flex;overflow-x:auto;gap:4px}aside nav button{white-space:nowrap;width:auto}.logo,.br{display:none}.g4,.g2,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}main{padding:16px}.top h1{font-size:21px}.pill{display:none}}
@media(max-width:560px){.g4,.g3{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside><div class="logo"><i>AP</i><div><b>Account Practice OS</b><small>Operations platform</small></div></div><nav id="nav"></nav>
<div class="br"><b style="color:#fff">Clearview branch</b><br>Manager: Sarah Patel<br>Demo data, not live customer records.</div></aside>
<main><div class="top"><h1 id="ttl"></h1><span class="pill" id="clk"></span><button class="pill" id="th" aria-label="Toggle theme">Theme</button><div class="av">SP</div></div><div id="v"></div></main>
</div>
<div class="ov" id="ov"><div class="ph" id="ph"></div></div>
<div class="toast" id="ts"></div>
<script>
const $=s=>document.querySelector(s);
const NAV=[["dash","▦","Dashboard"],["leads","✦","Leads & AI intake"],["quotes","£","Quotes"],["journey","⇄","Client journey"],["aml","⛨","Compliance & AML"],["docs","▤","Documents"],["rem","◔","Reminders & calls"],["queue","☰","Accountant queue"],["portal","◧","Customer portal"],["roi","◆","Network & ROI"],["integ","⌁","Integrations & rollout"]];
const T={dash:"Practice overview",leads:"Leads & AI intake",quotes:"Quotations",journey:"Client journey",aml:"Compliance & AML",docs:"Document collection",rem:"Reminders, calls & escalation",queue:"Accountant work queue",portal:"Customer portal",roi:"Network performance & ROI",integ:"Integrations, rollout & governance"};
const SUB={dash:"Every customer, every deadline, one view",leads:"Enquiries classified and routed in seconds",quotes:"Draft → Sent → Viewed → Accepted",journey:"ABC Trading Ltd · 12 connected stages",aml:"AI prepares evidence. People make the decision.",docs:"ABC Trading Ltd · year ending 31 March 2026",rem:"Risk-based, configurable sequences",queue:"Right case, right accountant, ready to work",portal:"What your customer sees, wired to the practice side",roi:"The owner’s view across every branch",integ:"Plugs into the software you already use"};
const STG=[["Lead & enquiry","Lead ID created, source tagged, AI reads intent and routes to the branch. Acknowledgement sent."],["Qualification","Questionnaire sent. AI suggests Annual accounts, Corporation Tax, VAT and Payroll."],["Consultation & quote","Consultation notes, pricing template and proposal generated. Customer accepts online."],["Registration","Customer ID and secure portal created. Duplicate accounts prevented."],["AML & compliance","ID verification and risk assessment. Compliance officer approval is required."],["Engagement","Engagement letter generated from approved template and e-signed."],["Payment","Invoice and payment link sent. Webhook updates payment status automatically."],["Document collection","Personalised checklist, OCR classification, duplicate and readability checks."],["Clarification","Automated queries for missing periods and unclear items, linked to the case."],["Allocation","Release checks pass. Case allocated by skill, workload and deadline."],["Processing & review","Accountant works in existing accounting software. Reviewer approves."],["Completion","Delivery confirmed, payment reconciled, next-cycle reminders scheduled."]];
const AUTO=["Lead L-20931 created from Google Business Profile","Questionnaire answered. 4 services suggested for employee confirmation","Quote Q-4417 accepted by customer. £1,860 per year","Customer C-10482 created. Portal invite sent","ID verified by provider. Case routed to compliance officer","Engagement letter signed electronically","Payment webhook received. Receipt sent","Checklist issued. 9 documents requested","Query raised: March bank statement missing. Customer emailed","Case passed release checks. Allocated to John Smith","Accountant completed preparation. Quality review approved","Completion email sent. VAT reminder scheduled for next quarter"];
let feed=[["Voice AI","Called customer R. Okoye. Upload link sent by SMS","09:12"],["Compliance","Risk review requested for Hartley Lettings Ltd","09:04"],["AI","Document classified: P60 – Self Assessment (M. Bell)","08:57"],["System","Deadline risk detected: Corporation Tax filing, Northgate Foods","08:40"]];
const J={i:0,aml:false,pay:false,run:null};
let docs=[["Bank statements Apr–Feb","Accepted"],["March bank statement","Required"],["Sales invoices","Accepted"],["Purchase invoices","Accepted"],["Expense receipts","Verified"],["Previous annual accounts","Verified"],["VAT returns","Required"],["Payroll reports","Required"],["Director loan information","Required"]];
let leads=[["L-20927","Hartley Lettings Ltd","Phone","Landlord / Ltd","Property income, Corporation Tax","New"],["L-20928","M. Bell","Website","Individual","Self Assessment","Contacted"],["L-20929","Northgate Foods","Referral","Limited company","VAT, Payroll, Accounts","Qualified"],["L-20930","R. Okoye","Google Profile","Sole trader","Annual accounts, MTD","Quoted"]];
let quotes=[["Q-4417","ABC Trading Ltd","£1,860 / yr",3],["Q-4418","Hartley Lettings Ltd","£980 / yr",1],["Q-4419","Northgate Foods","£3,240 / yr",2],["Q-4420","M. Bell","£240 one-off",4]];
const QS=["Draft","Sent","Viewed","Accepted","Rejected","Expired"];
let aml=[["Hartley Lettings Ltd","Medium","Pending","ID verified. Beneficial ownership outstanding"],["Northgate Foods","High","Manual review","Overseas director. Source of funds needed"],["M. Bell","Low","In progress","ID check running"],["R. Okoye","Low","Approved","Approved by S. Patel"]];
let QD=[["Q-1","ABC Trading Ltd","Annual accounts","Accounts",0,"High","15 Nov"],["Q-2","Northgate Foods","Payroll","Payroll",0,"Medium","30 Nov"],["Q-3","M. Bell","Self Assessment","Tax",1,"High","31 Jan"],["Q-4","Hartley Lettings","VAT return","VAT",2,"Medium","7 Dec"],["Q-5","R. Okoye","Annual accounts","Accounts",3,"Low","20 Dec"]];
const ACC={"John Smith":["Accounts",6],"Priya Nair":["Payroll",4],"Mark Davies":["Tax",7],"Elena Rossi":["VAT",3]};
const COLS=["Ready for allocation","Allocated","In progress","Ready for review","Ready for delivery"];
const CAD=[[0,"Initial document request","Email"],[2,"Friendly reminder","Email"],[4,"Reminder with outstanding items","Email + SMS"],[6,"Second reminder","Email"],[8,"Automated voice call","Voice AI"],[10,"Escalate to branch employee","Task"],[12,"Branch manager notified","Alert"]];
let view="dash",day=0;
function log(t,w="AI"){feed.unshift([w,t,new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})]);feed=feed.slice(0,30)}
function toast(m){const t=$("#ts");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600)}
const tg=(t,c)=>`<span class="tag ${c||""}">${t}</span>`;
const sc=s=>({Approved:"ok",Verified:"ok",Accepted:"ok",Paid:"ok","Manual review":"er",Required:"mu",Pending:"wn",Processing:"wn",Uploaded:"wn","In progress":"wn",New:"",Contacted:"wn",Qualified:"ok",Quoted:"ok"}[s]||"");
function feedHtml(n){return `<div class="feed">${feed.slice(0,n||30).map(f=>`<div><span class="dot ${f[0]=="Compliance"||f[0]=="System"?"h":""}"></span><span><b>${f[0]}</b> · ${f[1]}</span><time>${f[2]}</time></div>`).join("")}</div>`}
const V={
dash(){const st=[34,22,18,15,12,11,9,26,14,8,31,6],mx=34;
return `<div class="card hero g" style="margin-bottom:16px"><div style="flex:1"><h2>Your digital operations employee is on shift</h2><p>Chasing documents, answering routine questions and escalating risk across all branches, 24 hours a day. Start the guided demo to watch one customer move from enquiry to completion.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn w" onclick="go('journey');runJ()">Start live demo</button><button class="btn w" onclick="go('roi')">Owner’s view</button></div></div>
<div class="g g4" style="margin-bottom:16px">${[["Active customers","248","+12 this month"],["Open leads","37","9 new today"],["Documents awaiting","64","18 chased automatically"],["Deadlines at risk","5","2 critical"]].map(k=>`<div class="card kpi"><span>${k[0]}</span><b>${k[1]}</b><i>${k[2]}</i></div>`).join("")}</div>
<div class="g g2"><div class="card"><h3>Customers by lifecycle stage<em>Click a stage to open the journey</em></h3>${STG.map((s,i)=>`<div style="display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center;margin:7px 0;cursor:pointer" onclick="J.i=${Math.min(i,11)};go('journey')"><span style="font-size:13px">${s[0]}</span><div class="bar"><i style="width:${st[i]/mx*100}%"></i></div><b>${st[i]}</b></div>`).join("")}</div>
<div class="card"><h3>Live activity<em>● streaming</em></h3><div id="df">${feedHtml(8)}</div></div></div>
<div class="card" style="margin-top:16px"><h3>Statutory deadline risk<em>Predicted before the deadline fails</em></h3><div class="tb"><table><tr><th>Customer</th><th>Filing</th><th>Due</th><th>Blocker</th><th>Risk</th><th></th></tr>${[["Northgate Foods","Corporation Tax","12 days","Documents outstanding",82],["ABC Trading Ltd","Annual accounts","6 days","Awaiting review",64],["Hartley Lettings","VAT return","3 days","Customer unresponsive",91],["M. Bell","Self Assessment","78 days","None",12]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td style="width:160px"><div class="bar"><i style="width:${r[4]}%;background:${r[4]>75?"var(--er)":r[4]>50?"var(--wn)":"var(--ok)"}"></i></div></td><td>${r[4]>50?`<button class="btn sm" onclick="nudge('${r[0]}')">Intervene</button>`:""}</td></tr>`).join("")}</table></div></div>`},
leads(){return `<div style="display:flex;gap:10px;margin-bottom:14px"><button class="btn" onclick="newLead()">+ Simulate incoming enquiry</button></div><div class="card tb"><table><tr><th>Lead ID</th><th>Name</th><th>Source</th><th>Type</th><th>AI suggested services</th><th>Status</th></tr>${leads.map((l,i)=>`<tr class="cl" onclick="leadOpen(${i})"><td>${l[0]}</td><td><b>${l[1]}</b></td><td>${l[2]}</td><td>${l[3]}</td><td>${l[4]}</td><td>${tg(l[5],sc(l[5]))}</td></tr>`).join("")}</table></div><div id="ld" style="margin-top:16px"></div>`},
quotes(){return `<div class="card tb"><table><tr><th>Quote</th><th>Customer</th><th>Fee</th><th>Status</th><th></th></tr>${quotes.map((q,i)=>`<tr><td>${q[0]}</td><td><b>${q[1]}</b></td><td>${q[2]}</td><td>${tg(QS[q[3]],q[3]==3?"ok":q[3]>3?"er":"")}</td><td>${q[3]<3?`<button class="btn s sm" onclick="qAdv(${i})">Advance to ${QS[q[3]+1]}</button>`:""} ${q[3]<3?`<button class="btn s sm" onclick="qRej(${i})">Mark rejected</button>`:""}</td></tr>`).join("")}</table></div><p style="color:var(--mu)">Supports fixed fees, recurring fees, one-off charges and additional work. Unanswered quotes trigger automated follow-ups, and accepted quotes move the customer into onboarding.</p>`},
journey(){const x=STG[J.i];const c=[["Onboarding",J.i>3],["AML approved",J.aml],["Engagement signed",J.i>5],["Payment or exception",J.pay],["Documents complete",docs.every(d=>d[1]!="Required")]];
return `<div class="steps">${STG.map((s,i)=>`<button class="${i<J.i?"dn":i==J.i?"cu":""}" onclick="J.i=${i};render()"><b>${i<J.i?"✓":i+1}</b>${s[0]}</button>`).join("")}</div>
<div class="g g2"><div class="card"><h3>Stage ${J.i+1}: ${x[0]}</h3><p style="margin:0 0 10px">${x[1]}</p>
${J.i==4&&!J.aml?`<div class="note"><b>Awaiting compliance officer.</b> AI has prepared the evidence pack but cannot approve AML clearance. <button class="btn sm" onclick="amlOk()">Approve as S. Patel</button></div>`:""}
<div class="mail"><b>Automation result:</b> ${AUTO[J.i]}</div>
<div class="cond">${c.map(k=>tg((k[1]?"✓ ":"○ ")+k[0],k[1]?"ok":"mu")).join("")}</div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="adv()" ${J.i==11?"disabled":""}>Advance stage</button><button class="btn s" onclick="runJ()">${J.run?"Pause demo":"Run guided demo"}</button><button class="btn s" onclick="resetJ()">Reset</button></div>
${J.i==11?`<div class="note ok" style="margin-top:14px">Case complete. Customer notified, payment reconciled, next-cycle reminders created.</div>`:""}</div>
<div class="card"><h3>Case activity<em>Linked to C-10482</em></h3>${feedHtml(12)}</div></div>`},
aml(){return `<div class="note"><b>Critical rule:</b> AI never approves AML clearance, dismisses suspicious activity or makes the firm’s statutory decisions. Higher-risk cases route to the compliance officer.</div><div class="card tb"><table><tr><th>Customer</th><th>Risk</th><th>Status</th><th>Evidence</th><th></th></tr>${aml.map((a,i)=>`<tr><td><b>${a[0]}</b></td><td>${tg(a[1],a[1]=="High"?"er":a[1]=="Medium"?"wn":"ok")}</td><td>${tg(a[2],sc(a[2]))}</td><td>${a[3]}</td><td>${a[2]!="Approved"?`<button class="btn sm" onclick="amlDec(${i},1)">Approve</button> <button class="btn s sm" onclick="amlDec(${i},0)">Request more checks</button>`:""}</td></tr>`).join("")}</table></div><p style="color:var(--mu)">Every decision is stored with the evidence, the officer’s name and a timestamp. Ongoing due diligence refreshes trigger when customer circumstances change.</p>`},
docs(){const n=docs.filter(d=>d[1]=="Accepted"||d[1]=="Verified").length,miss=docs[1][1]=="Required";
return `<div class="g g2"><div class="card"><h3>Checklist<em>${n}/${docs.length} received</em></h3><div class="bar" style="margin-bottom:10px"><i style="width:${n/docs.length*100}%"></i></div><div class="tb"><table>${docs.map((d,i)=>`<tr><td><b>${d[0]}</b></td><td>${tg(d[1],sc(d[1]))}</td><td>${d[1]=="Required"?`<button class="btn sm" onclick="up(${i})">Upload sample</button>`:d[1]=="Accepted"?`<button class="btn s sm" onclick="ver(${i})">Mark verified</button>`:""}</td></tr>`).join("")}</table></div>
<p style="color:var(--mu);font-size:13px">Three separate levels: technical validation by AI, completeness checks by the system, and professional verification by an authorised reviewer. The accountant can mark any item not applicable.</p></div>
<div class="card"><h3>Clarification assistant</h3>${miss?`<div class="note">AI found a gap in the bank statements: <b>March</b> is missing.</div><button class="btn" onclick="mailGap()">Send automated query</button><div id="ml"></div>`:`<div class="note ok">All periods covered. Case can move to review.</div>`}
<div class="mail"><b>Customer asks:</b> “Why do you need my bank statements?”<br><br><b>AI answers from the approved knowledge base:</b> We need them so your accountant can review income and spending for the period.<br><br><button class="btn s sm" onclick="toast('Tax advice question detected. Query created for the accountant.')">Ask a tax advice question</button></div></div></div>`},
rem(){return `<div class="g g2"><div class="card"><h3>Document chase sequence<em>Configurable example</em></h3><input type="range" min="0" max="12" value="${day}" oninput="setDay(this.value)" aria-label="Days since request"><p style="color:var(--mu);margin:6px 0 14px">Customer has been silent for <b id="dv">${day}</b> days</p><div class="tl" id="tl">${tl()}</div></div>
<div class="card"><h3>Voice AI</h3><p style="margin-top:0">Calls are triggered by an approved risk policy, never just a reminder count. Every call has human escalation and opt-out handling.</p><button class="btn" onclick="call()">Place AI call to R. Okoye</button><div class="mail" style="margin-top:16px"><b>Critical deadline watch</b><br>Monitors due dates, outstanding documents, accountant progress and bottlenecks. Notifies customer, accountant and manager, then creates an urgent intervention task.</div></div></div>`},
queue(){const m=QD.filter(q=>q[4]==0).length;return `<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap"><button class="btn" onclick="alloc()" ${m?"":"disabled"}>Auto-allocate ${m} ready case${m==1?"":"s"}</button>${Object.entries(ACC).map(a=>tg(a[0]+" · "+a[1][0]+" · "+a[1][1]+" cases","mu")).join("")}</div>
<div class="g" style="grid-template-columns:repeat(5,minmax(170px,1fr));overflow-x:auto">${COLS.map((c,ci)=>`<div class="col"><h4>${c} (${QD.filter(q=>q[4]==ci).length})</h4>${QD.map((q,i)=>q[4]==ci?`<div class="kc" onclick="qd(${i})"><b>${q[1]}</b><small>${q[2]} · due ${q[6]}</small>${tg(q[5],q[5]=="High"?"er":q[5]=="Medium"?"wn":"mu")}${q[7]?`<small style="margin-top:6px">👤 ${q[7]}</small>`:""}</div>`:"").join("")}</div>`).join("")}</div><p style="color:var(--mu)">Click a card to move it forward. Managers can override any allocation.</p>`},
roi(){return `<div class="g g4" style="margin-bottom:16px">${[["Admin hours saved","3,640 / mo","across 40 branches"],["Lead response","4 min","was 6 hours"],["Debtor days","19","was 41"],["Missed deadlines","0","14 risks caught early"]].map(k=>`<div class="card kpi"><span>${k[0]}</span><b>${k[1]}</b><i>${k[2]}</i></div>`).join("")}</div>
<div class="g g2"><div class="card"><h3>Return on investment calculator<em>Illustrative. Drag to model your network</em></h3>${[["b","Branches",1,120],["s","Staff per branch",2,20],["h","Admin hours per person per week",2,25],["c","Hourly staff cost (£)",10,40]].map(r=>`<label style="display:block;margin:8px 0 2px">${r[1]}: <b id="r_${r[0]}">${R[r[0]]}</b></label><input type="range" min="${r[2]}" max="${r[3]}" value="${R[r[0]]}" oninput="setR('${r[0]}',this.value)">`).join("")}<div id="rc">${rc()}</div></div>
<div class="card"><h3>Cash collected by month<em>£k, whole network</em></h3><div style="display:flex;align-items:flex-end;gap:10px;height:190px">${[["May",212],["Jun",236],["Jul",251],["Aug",274],["Sep",309],["Oct",352]].map(m=>`<div style="flex:1;text-align:center"><div style="height:${m[1]/352*140}px;background:linear-gradient(var(--ac2),var(--ac));border-radius:8px 8px 0 0"></div><small>${m[0]}<br><b>${m[1]}</b></small></div>`).join("")}</div><p style="color:var(--mu);font-size:12px;margin:10px 0 0">Automated invoicing, payment links and reminders shorten the time from work done to cash received.</p></div></div>
<div class="card" style="margin-top:16px"><h3>Branch league table<em>Branches under 80% on-time filing are flagged</em></h3><div class="tb"><table><tr><th>Branch</th><th>On-time filings</th><th>Lead response</th><th>Chasing automated</th><th>Cash collected</th><th></th></tr>${[["Clearview",96,4,81,"£352k"],["Northgate",91,7,76,"£298k"],["Riverside",88,9,70,"£261k"],["Westbourne",79,18,52,"£204k"],["Harbour",74,26,44,"£187k"]].map(b=>`<tr><td><b>${b[0]}</b></td><td style="width:210px">${b[1]}%<div class="bar"><i style="width:${b[1]}%;background:${b[1]<80?"var(--wn)":"var(--ok)"}"></i></div></td><td>${b[2]} min</td><td>${b[3]}%</td><td>${b[4]}</td><td>${b[1]<80?`<button class="btn sm" onclick="nudge('${b[0]}')">Send coaching task</button>`:""}</td></tr>`).join("")}</table></div></div>`},
portal(){const d=docs.filter(x=>x[1]=="Accepted"||x[1]=="Verified").length;return `<div class="note ok">This is the customer’s view. Actions here update the practice side instantly, so try signing, paying and asking a question, then check the Dashboard feed.</div>
<div class="card" style="max-width:900px;margin:auto;padding:0;overflow:hidden"><div style="background:linear-gradient(120deg,#0a1030,#27358f 70%,#0b8f86);color:#fff;padding:22px 24px"><div style="font:600 22px var(--d)">Welcome back, ABC Trading</div><div style="color:#c9d3ff">Year ending 31 March 2026 · Annual accounts, VAT and Payroll</div></div>
<div class="g g3" style="padding:20px"><div class="card"><h3>Engagement letter</h3><p style="color:var(--mu)">Review scope, fees and terms.</p>${P.s?tg("Signed","ok"):`<button class="btn sm" onclick="pAct('s')">Sign electronically</button>`}</div><div class="card"><h3>Invoice INV-2207</h3><p style="color:var(--mu)">£930 deposit, due in 7 days.</p>${P.p?tg("Paid","ok"):`<button class="btn sm" onclick="pAct('p')">Pay securely</button>`}</div><div class="card"><h3>Documents</h3><p style="color:var(--mu)">${d} of ${docs.length} received.</p><button class="btn s sm" onclick="go('docs')">Upload documents</button></div></div>
<div style="padding:0 20px 20px"><div class="card"><h3>Ask the assistant<em>Answers come from the approved knowledge base</em></h3><div id="cb">${cbh()}</div><div style="margin-top:10px">${["Why do you need my bank statements?","When is my filing deadline?","Should I take dividends or salary?"].map((q,i)=>`<button class="btn s sm" style="margin:0 6px 6px 0" onclick="ask(${i})">${q}</button>`).join("")}</div></div></div></div>`},
integ(){return `<div class="g g3">${IT.map((x,i)=>`<div class="card"><h3>${x[0]}<em>${tg(x[2]?"Connected":"Available",x[2]?"ok":"mu")}</em></h3><p style="margin:0 0 12px;color:var(--mu)">${x[1]}</p><button class="btn s sm" onclick="tgI(${i})">${x[2]?"Disconnect":"Connect"}</button></div>`).join("")}</div>
<div class="g g2" style="margin-top:16px"><div class="card"><h3>Rollout plan<em>Low risk, branch by branch</em></h3><div class="tl"><div class="a">Weeks 1–2 · Map workflows, checklists and approved templates per service</div><div class="a">Weeks 3–6 · Pilot in 3 branches, measure hours saved and lead response</div><div>Weeks 7–14 · Extend to 20 branches, train branch managers</div><div>Weeks 15–26 · Network rollout with owner dashboard and monthly review</div></div></div>
<div class="card"><h3>Governance guardrails</h3><div class="tb"><table>${[["AML clearance","Compliance officer only"],["Tax advice questions","Escalated to accountant"],["Document correctness","Authorised reviewer verifies"],["Voice calls","Approved policy, opt-out, human escalation"],["Payment blocks","Configurable, manager exceptions"],["Every action","Time-stamped audit trail"]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${tg(r[1],"ok")}</td></tr>`).join("")}</table></div><p style="color:var(--mu);font-size:12px;margin-bottom:0">The platform sits around your accounting and practice software. It does not replace professional judgement.</p></div></div>`}};
function tl(){return CAD.map(c=>`<div class="${day>=c[0]?"a":""}">Day ${c[0]} · ${c[1]} ${tg(c[2],day>=c[0]?"ok":"mu")}</div>`).join("")}
let R={b:40,s:6,h:12,c:18},P={s:0,p:0,c:[]};
const IT=[["Xero & QuickBooks","Sync customers, invoices and payments with the accounting software you already use.",1],["Practice management","Two-way sync with your existing practice-management system.",1],["Companies House","Pull filing dates and officer data into each case.",1],["HMRC deadlines","Deadline calendar and status. Filing stays in the accountant’s tools.",0],["Stripe & GoCardless","Card payments and direct debits with automatic status updates.",1],["ID verification provider","Approved identity checks feeding the AML workflow.",1],["Voice AI & SMS","Automated calls and texts with opt-out handling.",1],["WhatsApp & email","Customer replies linked to the right case automatically.",0],["E-signature","Engagement letters signed and stored on the customer record.",1]];
function rc(){const a=R.b*R.s*R.h*R.c*46*.65,p=R.b*349*12,f=x=>"£"+Math.round(x).toLocaleString("en-GB");return `<div class="g g3" style="margin-top:14px"><div class="kpi"><span>Annual saving</span><b>${f(a)}</b></div><div class="kpi"><span>Platform cost</span><b>${f(p)}</b></div><div class="kpi"><span>Net benefit</span><b style="color:var(--ok)">${f(a-p)}</b></div></div><p style="color:var(--mu);font-size:12px">${(a/p).toFixed(1)}× return. Assumes 65% of admin time automated, 46 working weeks and an illustrative £349 per branch per month. Replace with your real figures.</p>`}
function setR(k,v){R[k]=+v;$("#r_"+k).textContent=v;$("#rc").innerHTML=rc()}
function cbh(){return P.c.map(m=>`<div class="mail" style="margin:6px 0"><b>${m[0]?"Customer":"Assistant"}:</b> ${m[1]}</div>`).join("")||"<span style='color:var(--mu)'>Choose a question below.</span>"}
function ask(i){const q=[["Why do you need my bank statements?","So your accountant can review income and spending for the period. Please upload statements for the dates requested."],["When is my filing deadline?","Your annual accounts are due by 31 December 2026. Your accountant aims to finish by 15 November."],["Should I take dividends or salary?","That needs tax advice, so I haven’t guessed. I’ve created a query for John Smith, who will reply within one working day."]][i];P.c.push([1,q[0]],[0,q[1]]);if(i==2)log("Tax advice query raised for John Smith (ABC Trading)","System");$("#cb").innerHTML=cbh()}
function pAct(k){P[k]=1;log(k=="s"?"Engagement letter signed electronically by ABC Trading":"Payment webhook received: £930 paid by ABC Trading");toast(k=="s"?"Signed. Practice updated":"Payment received. Receipt sent");render()}
function tgI(i){IT[i][2]^=1;log(IT[i][0]+(IT[i][2]?" connected":" disconnected"),"System");render()}
function setDay(v){day=+v;$("#dv").textContent=v;$("#tl").innerHTML=tl()}
function render(){$("#nav").innerHTML=NAV.map(n=>`<button class="${n[0]==view?"on":""}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join("");$("#ttl").innerHTML=T[view]+`<small>${SUB[view]}</small>`;$("#v").innerHTML=V[view]()}
function go(v){view=v;render();scrollTo(0,0)}
function nudge(n){log("Urgent intervention task created for "+n+". Manager and accountant notified.","System");toast("Intervention task created for "+n);render()}
function newLead(){const s=[["Priya Shah","Website","Individual","Self Assessment, CGT"],["Blue Fern Studio","Telephone","Start-up","Company formation, Accounts"],["K. Adeyemi","Social media","Contractor","Self Assessment, CIS"]][leads.length%3];const id="L-"+(20931+leads.length);leads.unshift([id,s[0],s[1],s[2],s[3],"New"]);log("AI classified "+id+" ("+s[0]+") and routed it to Clearview branch");toast("New enquiry captured and classified");render()}
function leadOpen(i){const l=leads[i];$("#ld").innerHTML=`<div class="card"><h3>${l[1]} · ${l[0]}<em>AI summary</em></h3><p style="margin-top:0">${l[3]} enquiry via ${l[2]}. Likely needs: <b>${l[4]}</b>. Acknowledgement sent. Sales follow-up due within SLA.</p><div style="display:flex;gap:8px"><button class="btn sm" onclick="leadAct(${i},'Qualified','Questionnaire sent')">Send questionnaire</button><button class="btn s sm" onclick="leadAct(${i},'Quoted','Quote task created')">Create quote task</button></div><p style="color:var(--mu);font-size:12px;margin-bottom:0">Suggestion only. Branch employee confirms scope and suitability.</p></div>`}
function leadAct(i,s,m){leads[i][5]=s;log(m+" for "+leads[i][1]);toast(m);render();leadOpen(i)}
function qAdv(i){quotes[i][3]++;log(quotes[i][0]+" moved to "+QS[quotes[i][3]],"System");render()}
function qRej(i){quotes[i][3]=4;render()}
function amlDec(i,ok){aml[i][2]=ok?"Approved":"Additional information";aml[i][3]=ok?"Approved by S. Patel with evidence recorded":"More evidence requested by S. Patel";log(aml[i][0]+": "+aml[i][3],"Compliance");toast("Decision recorded");render()}
function amlOk(){J.aml=true;log("AML approved by compliance officer S. Patel. Evidence stored.","Compliance");toast("Compliance decision recorded");render()}
function up(i){docs[i][1]="Uploaded";log("Upload received: "+docs[i][0]);render();setTimeout(()=>{docs[i][1]="Processing";render()},700);setTimeout(()=>{docs[i][1]="Accepted";log("OCR complete. Readable, no duplicates: "+docs[i][0]);render()},1900)}
function ver(i){docs[i][1]="Verified";log("Reviewer verified: "+docs[i][0],"Reviewer");render()}
function mailGap(){$("#ml").innerHTML=`<div class="mail"><b>Subject:</b> Additional document required – Your annual accounts<br><br>Dear ABC Trading, we have received your bank statements for April to February. The March statement is still outstanding. Please upload it using your secure portal.<br><br>Account Practice Team</div>`;log("Automated query sent: March statement missing (ABC Trading)");toast("Customer emailed")}
function adv(){if(J.i==4&&!J.aml){toast("Blocked: compliance officer must approve AML first");return false}
if(J.i==8&&docs.some(d=>d[1]=="Required")){toast("Blocked: outstanding documents. Upload the March statement");return false}
if(J.i==6)J.pay=true;J.i++;log(AUTO[J.i-1]);render();return true}
function resetJ(){clearInterval(J.run);J.run=null;J.i=0;J.aml=false;J.pay=false;toast("Journey reset");render()}
function runJ(){if(J.run){clearInterval(J.run);J.run=null;toast("Demo paused");render();return}
go("journey");toast("Guided demo running");J.run=setInterval(()=>{if(J.i==7)docs.forEach(d=>{if(d[1]=="Required"&&d[0]!="March bank statement")d[1]="Accepted"});if(J.i==8&&docs[1][1]=="Required"){docs[1][1]="Accepted";log("Customer uploaded March statement. Query resolved.")}
if(J.i==4&&!J.aml){render();toast("Paused: waiting for the compliance officer");clearInterval(J.run);J.run=null;return}
if(J.i>=11){clearInterval(J.run);J.run=null;render();return}adv()},1700)}
function alloc(){QD.forEach(q=>{if(q[4]==0){let b=null;for(const[n,a]of Object.entries(ACC))if(a[0]==q[3]&&(!b||a[1]<ACC[b][1]))b=n;if(b){q[4]=1;q[7]=b;ACC[b][1]++;log("Allocated "+q[1]+" to "+b+" by skill match and lowest workload")}}});toast("Cases allocated");render()}
function qd(i){if(QD[i][4]<4){QD[i][4]++;if(QD[i][4]==4)log("Ready for delivery: "+QD[i][1]+". Customer notification queued.");else log(QD[i][1]+" moved to "+COLS[QD[i][4]],"Accountant")}else{QD.splice(i,1);toast("Delivered. Customer notified and payment reconciled")}render()}
function call(){const o=$("#ov"),p=$("#ph");o.classList.add("on");p.innerHTML=`<div style="text-align:center"><b>Account Practice assistant</b><div style="color:#8d99c4;font-size:12px">Calling R. Okoye…</div><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div id="tr"></div><div id="ch"></div>`;
const L=[["a","Hello, this is an automated assistant calling for your Account Practice accountancy practice."],["a","Some documents for your annual tax return are still missing. Would you like a secure upload link by SMS?"]];
L.forEach((l,i)=>setTimeout(()=>{$("#tr").innerHTML+=`<div class="ln">${l[1]}</div>`;if(i==1)$("#ch").innerHTML=[["Yes, send the link","Customer asked for the upload link. SMS sent."],["Speak to my accountant","Customer asked for a human. Callback task created."],["I need more time","Customer requested more time. Follow-up set for 3 days."]].map(r=>`<button class="btn s sm" style="margin:4px 4px 0 0" onclick="callEnd('${r[0]}','${r[1]}')">${r[0]}</button>`).join("")},900*(i+1)))}
function callEnd(a,r){$("#tr").innerHTML+=`<div class="ln u">${a}</div>`;$("#ch").innerHTML="";setTimeout(()=>{$("#ov").classList.remove("on");log(r,"Voice AI");toast("Call recorded and case updated");render()},1100)}
$("#ov").onclick=e=>{if(e.target.id=="ov")$("#ov").classList.remove("on")};
$("#th").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()=="#070b1a";r.dataset.theme=d?"light":"dark"};
setInterval(()=>{$("#clk").textContent=new Date().toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});},1000);
const EV=[["AI","Enquiry classified: VAT registration (Blue Fern Studio)"],["Voice AI","Call completed. Customer asked for upload link"],["System","Payment webhook received. Case released to accountant queue"],["AI","Reminder sent: 3 documents outstanding (Northgate Foods)"],["Compliance","Beneficial ownership evidence received"]];let ei=0;
setInterval(()=>{if(view=="dash"){const e=EV[ei++%EV.length];log(e[1],e[0]);const f=$("#df");if(f)f.innerHTML=feedHtml(8)}},5000);
render();
</script>
